[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-agent-guardrails"
version = "0.1.0"
description = "Local-first safety guardrails for LangGraph/LangChain agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BackdoorSentient" }]
keywords = ["llm", "guardrails", "langgraph", "langchain", "pydantic"]
dependencies = [
    "langgraph",
    "langchain",
    "langchain-community",
    "pydantic",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["guardrails*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
